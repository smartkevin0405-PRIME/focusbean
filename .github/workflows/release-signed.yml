name: Build and sign BeanFocus APK

# Run by hand from the Actions tab (main only). Signing uses repository secrets:
#   SIGNING_KEYSTORE_B64    base64 of the existing .p12 keystore
#   SIGNING_KEY_ALIAS       key alias
#   SIGNING_STORE_PASSWORD  keystore password
#   SIGNING_KEY_PASSWORD    key password (optional when it equals the keystore password)
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish as the latest GitHub release (the in-app updater picks it up)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: beanfocus-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: android/BeanFocus
    outputs:
      version: ${{ steps.verify.outputs.version }}
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK and checksum-verified compiler
        run: |
          : "${ANDROID_HOME:?The runner must provide an Android SDK}"
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$sdkmanager" ]]; then
              sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
            fi
            test -x "$sdkmanager"
            "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          compiler="$RUNNER_TEMP/ecj-3.37.0.jar"
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 120 \
            --proto '=https' --tlsv1.2 \
            --output "$compiler" \
            'https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.37.0/ecj-3.37.0.jar'
          printf 'cde026ff966b48b5e5f148b6f041ceff3cf4f85cf75155f4ec0f40e4ee14b545  %s\n' "$compiler" | sha256sum --check --strict
          {
            printf 'ANDROID_JAR=%s/platforms/android-35/android.jar\n' "$ANDROID_HOME"
            printf 'BUILD_TOOLS=%s/build-tools/35.0.0\n' "$ANDROID_HOME"
            printf 'ECJ_JAR=%s\n' "$compiler"
          } >> "$GITHUB_ENV"
      - name: Run Java and JavaScript regression tests
        run: bash tests/run-tests.sh
      - name: Audit browser blocking and service integration
        run: python3 tests/audit_015.py
      - name: Compile and package unsigned APK
        env:
          UNSIGNED_ONLY: '1'
        run: bash build.sh
      - name: Sign with the existing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in SIGNING_KEYSTORE_B64 SIGNING_KEY_ALIAS SIGNING_STORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Repository secret $name is not set."
              exit 1
            fi
          done
          : "${SIGNING_KEY_PASSWORD:=$SIGNING_STORE_PASSWORD}"
          export SIGNING_KEY_PASSWORD
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          key="$key_dir/key.p12"
          printf '%s' "$SIGNING_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$key"
          chmod 600 "$key"
          # Refuse any key other than the one the installed app was signed with.
          expected=5e7325b0fbb0af5df2c80c300f0ac8d7e6e1ccd1d23bae0f8b6e2baec4b748f4
          actual="$(keytool -exportcert -keystore "$key" -alias "$SIGNING_KEY_ALIAS" \
            -storepass:env SIGNING_STORE_PASSWORD | sha256sum | cut -d' ' -f1)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::The keystore secret is not the existing BeanFocus signing key."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release"
          java -jar "$BUILD_TOOLS/lib/apksigner.jar" sign --ks "$key" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD \
            --out "$RUNNER_TEMP/release/BeanFocus-latest.apk" build/aligned.apk
      - name: Verify package, version, certificate and Samsung permission
        id: verify
        working-directory: ${{ github.workspace }}
        run: |
          apk="$RUNNER_TEMP/release/BeanFocus-latest.apk"
          meta="$RUNNER_TEMP/release.json"
          python3 - "$apk" "$meta" <<'PY'
          import hashlib, json, os, sys, xml.etree.ElementTree as ET
          apk, meta = sys.argv[1:]
          ns = "{http://schemas.android.com/apk/res/android}"
          root = ET.parse("android/BeanFocus/AndroidManifest.xml").getroot()
          data = {
              "package": root.get("package"),
              "versionCode": int(root.get(ns + "versionCode")),
              "versionName": root.get(ns + "versionName"),
              "sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
              "certificateSha256": "5e7325b0fbb0af5df2c80c300f0ac8d7e6e1ccd1d23bae0f8b6e2baec4b748f4",
              "sourceCommit": os.environ["GITHUB_SHA"],
          }
          open(meta, "w").write(json.dumps(data, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("version=" + data["versionName"] + "\n")
              out.write("sha256=" + data["sha256"] + "\n")
          PY
          python3 .github/scripts/verify_apk.py --apk "$apk" --metadata "$meta" --build-tools "$BUILD_TOOLS"
          "$BUILD_TOOLS/aapt2" dump badging "$apk" \
            | grep -Fqx "uses-permission: name='com.samsung.android.sbrowser.permission.CONTENTBLOCKER'"
          "$BUILD_TOOLS/zipalign" -c -p 4 "$apk"
          (cd "$RUNNER_TEMP/release" && sha256sum BeanFocus-latest.apk > SHA256SUMS)
          {
            echo "### 집중콩 $(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["versionName"])' "$meta")"
            echo
            echo "- SHA-256: \`$(cut -d' ' -f1 "$RUNNER_TEMP/release/SHA256SUMS")\`"
            echo "- Source: \`$GITHUB_SHA\`"
            echo "- Signed with the existing certificate; package, version and Samsung permission checked."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BeanFocus-${{ steps.verify.outputs.version }}
          path: |
            ${{ runner.temp }}/release/BeanFocus-latest.apk
            ${{ runner.temp }}/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: BeanFocus-${{ needs.build.outputs.version }}
      - name: Publish APK and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          APK_SHA256: ${{ needs.build.outputs.sha256 }}
        shell: bash
        run: |
          sha256sum --check --strict SHA256SUMS
          grep -Fq "$APK_SHA256" SHA256SUMS
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [[ "$draft" != "true" ]]; then
              echo "::error::$tag is already published. Increase the app version for a new release."
              exit 1
            fi
          else
            printf '%s\n' \
              "집중콩 $VERSION" "" \
              "기존 앱을 삭제하지 말고 업데이트 설치하세요." \
              "기존 인증서로 서명했고 앱 ID·버전·서명을 확인했습니다." \
              "실기기 동작은 별도 확인이 필요합니다." "" \
              "소스: $GITHUB_SHA" \
              "APK SHA-256: $APK_SHA256" > release-notes.md
            gh release create "$tag" --target "$GITHUB_SHA" --draft \
              --title "집중콩 $VERSION" --notes-file release-notes.md
          fi
          gh release upload "$tag" BeanFocus-latest.apk SHA256SUMS --clobber
          gh release edit "$tag" --draft=false --latest
