name: Validate BeanFocus source

on:
  push:
    paths:
      - 'android/BeanFocus/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'android/BeanFocus/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: android/BeanFocus
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK and checksum-verified compiler
        run: |
          : "${ANDROID_HOME:?The runner must provide an Android SDK}"
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$sdkmanager" ]]; then
              sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
            fi
            test -x "$sdkmanager"
            "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          compiler="$RUNNER_TEMP/ecj-3.37.0.jar"
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 120 \
            --proto '=https' --tlsv1.2 \
            --output "$compiler" \
            'https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.37.0/ecj-3.37.0.jar'
          printf 'cde026ff966b48b5e5f148b6f041ceff3cf4f85cf75155f4ec0f40e4ee14b545  %s\n' "$compiler" | sha256sum --check --strict
          {
            printf 'ANDROID_JAR=%s/platforms/android-35/android.jar\n' "$ANDROID_HOME"
            printf 'BUILD_TOOLS=%s/build-tools/35.0.0\n' "$ANDROID_HOME"
            printf 'ECJ_JAR=%s\n' "$compiler"
          } >> "$GITHUB_ENV"
      - name: Run Java and JavaScript regression tests
        run: bash tests/run-tests.sh
      - name: Audit browser blocking and service integration
        run: python3 tests/audit_015.py
      - name: Compile and package unsigned APK
        env:
          UNSIGNED_ONLY: '1'
        run: bash build.sh

      - name: Validate exact main source revision
        run: |
          git fetch --no-tags origin '32d593e9a47aa431198529d424da3830ee3e42be'
          cd ../..
          test "$(git show '32d593e9a47aa431198529d424da3830ee3e42be:android/BeanFocus/AndroidManifest.xml' | sha256sum | cut -d' ' -f1)" = "$(sha256sum android/BeanFocus/AndroidManifest.xml | cut -d' ' -f1)"
          git diff --exit-code '32d593e9a47aa431198529d424da3830ee3e42be' HEAD -- android/BeanFocus
      - name: Collect APK and public Android signing tools
        run: |
          mkdir -p build/export-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/export-tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" build/export-tools/aapt2
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" build/export-tools/zipalign
          sha256sum build/aligned.apk build/export-tools/* > build/export-tools/checksums.txt
      - name: Upload compiled APK for local private-key signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beanfocus-main-32d593e-unsigned
          retention-days: 1
          if-no-files-found: error
          path: |
            android/BeanFocus/build/aligned.apk
            android/BeanFocus/build/export-tools/
